name: bokrah_retail
description: "Bokra Retail desktop workspace"

publish_to: "none"

version: 3.5.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  http: ^1.1.0
  package_info_plus: ^4.0.0
  url_launcher: ^6.3.2
  go_router: ^16.2.1
  shared_preferences: ^2.2.2
  mobile_scanner: ^7.1.4
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  bokrah_design_system:
    path: ../../bokrah-design-system/packages/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
